<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perceptual Patterns — HUX 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #201fff;
        }
        .canvas-wrap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #201fff;
        }
        .webgl-fallback {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: block;
        }
        canvas.webgl {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        canvas.webgl.ready {
            opacity: 1;
        }
        nav {
            position: fixed;
            top: 24px;
            left: 24px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        nav a {
            color: #f4f4f4;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border: 1px solid rgba(244, 244, 244, 0.35);
            padding: 6px 16px;
            border-radius: 3px;
            background: rgba(7, 7, 38, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: background 0.2s, border-color 0.2s;
        }
        nav a:hover {
            background: rgba(7, 7, 38, 0.7);
            border-color: rgba(244, 244, 244, 0.7);
        }
    </style>
</head>
<body>
    <nav>
        <a href="../">← HUX 3D</a>
        <a href="../colour/">Colour</a>
        <a href="../typography/">Typography</a>
        <a href="../design-tokens/">Design Tokens</a>
    </nav>
    <div class="canvas-wrap">
        <img class="webgl-fallback" src="./perceptual-patterns-still.jpg" alt="Perceptual Patterns" />
        <canvas class="webgl"></canvas>
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
