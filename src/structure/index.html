<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUX 3D — Structure</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; }
    body { overflow: hidden; background: #1e1e1e; }
    #back-link {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 100;
      color: #888;
      text-decoration: none;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      transition: color 0.2s;
    }
    #back-link:hover { color: #fff; }
    #recording-hud {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      background: rgba(247, 46, 98, 0.15);
      border: 1px solid #f72e62;
      color: #f72e62;
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
      padding: 12px 24px;
      pointer-events: none;
    }
    #recording-hud.active { display: block; }
  </style>
</head>
<body>
  <a id="back-link" href="../">← HUX 3D</a>
  <div id="recording-hud">● REC 4K 30fps</div>
  <div id="root"></div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
