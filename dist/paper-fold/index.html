<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper Fold — HUX 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Page background shows through the transparent canvas */
        html, body {
            width: 100%;
            background: #ffffff;
            overflow-x: hidden;
        }

        /* Fixed canvas sits over the page; scroll-spacer drives the camera */
        canvas.webgl {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 300 vh of scrollable height — the camera descends through all of it */
        #scroll-spacer {
            height: 300vh;
            pointer-events: none;
        }
    </style>
  <script type="module" crossorigin src="/assets/paperFold-B6oVoKzI.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/three.module-rN4qoPaD.js">
</head>
<body>
    <canvas class="webgl"></canvas>
    <div id="scroll-spacer"></div>
</body>
</html>
