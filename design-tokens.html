<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Tokens</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ── DESIGN TOKENS ─────────────────────────────────────────────────────────────
const T = {
  background : 0x201fff,   // Blue-80
  cubeTop    : 0xf72e62,   // Pink
  cubeSide   : 0x070726,   // Blue-100
  line       : 0xf4f4f4,   // Light Grey
};

// ── SCENE ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(T.background);

// ── ISOMETRIC ORTHOGRAPHIC CAMERA ─────────────────────────────────────────────
// Camera placed along the (1,1,1) diagonal for a perfect isometric view.
// The screen-horizontal axis in world space is (1,0,−1)/√2, which is how we
// place the outlier cubes so they appear symmetrically left / right.
const FRUSTUM = 10;
let asp = window.innerWidth / window.innerHeight;

const camera = new THREE.OrthographicCamera(
  -FRUSTUM * asp / 2,   // left
   FRUSTUM * asp / 2,   // right
   FRUSTUM / 2,         // top
  -FRUSTUM / 2,         // bottom
  0.1, 1000
);
camera.position.set(10, 10, 10);
camera.lookAt(0, 0, 0);

// ── RENDERER ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ── LIGHTING ──────────────────────────────────────────────────────────────────
// Ambient keeps dark sides visible; directional light from upper-front-right
// adds the depth that separates the pink top from the near/far side faces.
scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(8, 14, 6);
scene.add(sun);

// A softer fill from the opposite side prevents pure black on the back faces
const fill = new THREE.DirectionalLight(0x8899ff, 0.2);
fill.position.set(-6, 2, -8);
scene.add(fill);

// ── MATERIALS ─────────────────────────────────────────────────────────────────
// BoxGeometry face group order: 0=+X  1=−X  2=+Y(top)  3=−Y  4=+Z  5=−Z
const matTop  = new THREE.MeshPhongMaterial({ color: T.cubeTop,  shininess: 25 });
const matSide = new THREE.MeshPhongMaterial({ color: T.cubeSide, shininess:  8 });

// Multi-material array — only index 2 (+Y) gets the pink top material
const multiMat = [ matSide, matSide, matTop, matSide, matSide, matSide ];

// ── CUBE FACTORY ──────────────────────────────────────────────────────────────
const cubes   = [];   // all Mesh references
const origins = [];   // base world positions for the float animation

function addCube(x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), multiMat);
  mesh.position.set(x, y, z);
  scene.add(mesh);
  cubes.push(mesh);
  origins.push(new THREE.Vector3(x, y, z));
}

// ── CENTRAL 2×2×2 CLUSTER ─────────────────────────────────────────────────────
// 8 cubes each 1 unit, with a 0.1-unit gap → step between centres = 1.1
const GAP  = 0.1;
const STEP = 1 + GAP;   // 1.1

for (let xi = 0; xi < 2; xi++)
for (let yi = 0; yi < 2; yi++)
for (let zi = 0; zi < 2; zi++) {
  addCube(
    (xi - 0.5) * STEP,   // −0.55 or +0.55
    (yi - 0.5) * STEP,
    (zi - 0.5) * STEP
  );
}

// ── OUTLIER CUBES ─────────────────────────────────────────────────────────────
// Screen-horizontal axis for this isometric camera is (1,0,−1)/√2.
// Placing cubes along (±d, 0, ∓d) makes them appear perfectly left / right
// on screen while staying in the same visual plane as the cluster.
addCube(-3.5,  0,  3.5);  // left  outlier
addCube( 3.5,  0, -3.5);  // right outlier

// ── DASHED CONNECTOR LINE ─────────────────────────────────────────────────────
const linePoints = [
  new THREE.Vector3(-3.5, 0,  3.5),
  new THREE.Vector3( 3.5, 0, -3.5),
];
const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
const lineMat = new THREE.LineDashedMaterial({
  color    : T.line,
  dashSize : 0.32,
  gapSize  : 0.16,
  linewidth: 1,           // WebGL: only 1 is reliably cross-platform
});
const connector = new THREE.Line(lineGeo, lineMat);
connector.computeLineDistances();  // required by LineDashedMaterial
scene.add(connector);

// ── ANIMATION LOOP ────────────────────────────────────────────────────────────
// Each cube gets a staggered phase so they bob independently,
// giving the cluster a lively, organic feel.
function animate() {
  requestAnimationFrame(animate);

  const t = Date.now() * 0.001;

  cubes.forEach((cube, i) => {
    const o = origins[i];
    cube.position.y = o.y + Math.sin(t + i * 0.45) * 0.10;
  });

  renderer.render(scene, camera);
}

animate();

// ── RESPONSIVE RESIZE ─────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  asp = window.innerWidth / window.innerHeight;
  camera.left  = -FRUSTUM * asp / 2;
  camera.right =  FRUSTUM * asp / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
